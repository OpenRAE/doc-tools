StylesPath = vale
MinAlertLevel = error
# Pin the Google style release; an unversioned name follows the latest release.
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip

[*.md]
BasedOnStyles = Google, DocTools
# STE-4.2 rejects contractions; Google.Contractions recommends them.
Google.Contractions = NO

# release-please writes CHANGELOG.md.
[CHANGELOG.md]
BasedOnStyles =
