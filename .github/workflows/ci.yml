name: CI

# Required checks for dev and main. Each job name is a branch protection context.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  # The `dev` merge queue runs each required check again on the merge group
  # commit (#13).
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VALE_VERSION: "3.9.1"
  # SHA-256 of vale_3.9.1_Linux_64-bit.tar.gz from the release checksums file.
  VALE_SHA256: fbc2eb47d0b8c50220ed1a2c5c611fbe0904ed567d638143d482016a18fd2db0

jobs:
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Run every hook on every file
        run: uvx --no-build pre-commit@4.3.0 run --all-files --show-diff-on-failure

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install Vale
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/vale.tar.gz"
          curl --proto '=https' -sSfL -o "$archive" \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin vale
          vale --version
      - name: Run tests
        run: uv run --frozen --no-build pytest -rs

  docs:
    name: Docs (STE and Vale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Vale
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/vale.tar.gz"
          curl --proto '=https' -sSfL -o "$archive" \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin vale
          vale --version
      - name: Check every maintained Markdown file
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.md' ':!:CHANGELOG.md')
          bash tools/ste-lint.sh "${files[@]}"
          vale sync
          vale "${files[@]}"

  sonarcloud:
    name: SonarCloud quality gate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # SonarCloud has no merge queue support. A merge group runs the pull
      # request analysis and the quality gate of the queued pull request
      # against `dev`, on the merge group commit (#13). The step fails when the
      # merge group does not identify a pull request that targets `dev`.
      - name: Resolve the analysis target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "merge_group" ]; then
            echo "args=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          pattern='^refs/heads/gh-readonly-queue/dev/pr-([0-9]+)-[0-9a-f]{40}$'
          if [[ ! "${QUEUE_REF}" =~ ${pattern} ]]; then
            echo "Unexpected merge group ref '${QUEUE_REF}'" >&2
            exit 1
          fi
          number="${BASH_REMATCH[1]}"
          head_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq 'select(.base.ref == "dev") | .head.ref')"
          if [ -z "${head_ref}" ]; then
            echo "Pull request ${number} does not target dev" >&2
            exit 1
          fi
          if [[ ! "${head_ref}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "The head branch of pull request ${number} is not a plain ref name" >&2
            exit 1
          fi
          printf 'args=-Dsonar.pullrequest.key=%s -Dsonar.pullrequest.branch=%s -Dsonar.pullrequest.base=dev\n' \
            "${number}" "${head_ref}" >> "${GITHUB_OUTPUT}"
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            ${{ steps.target.outputs.args }}
