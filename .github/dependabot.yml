version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: pre-commit
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
